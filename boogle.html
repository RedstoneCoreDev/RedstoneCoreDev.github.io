<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boogle Search - search fancy</title>
    <link rel="icon" type="image/png" href="boogle.png">
    <link rel="stylesheet" href="boogle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="lights" class="lights" aria-hidden="true"></div>
    <div id="snow" class="snow" aria-hidden="true"></div>
    
    <div class="container">
        <header>
            <div class="header-controls">
                <h1 id="boogle-title"> <span class="logo">Boogle</span> <span class="title-text">Search page</span> </h1> <div class="stuff"></div><button id="settings-btn" class="settings-btn" title="Settings" aria-haspopup="true" aria-controls="settings-panel">⚙️</button>
            </div>
        </header>
        <main>
            <div class="search-container">
                <div class="search-top">
                    <select id="engine-select" title="Choose search engine">
                        <option value="ddg">DuckDuckGo</option>
                        <option value="google">Google</option>
                    </select>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Search with Boogle..." autocomplete="off" aria-autocomplete="list">
                        <div id="history-dropdown" class="history-dropdown" role="listbox" aria-label="Search history" hidden></div>
                        <button id="search-button">Search</button>
                    </div>
                </div>
                <div class="buttons">
                    <button class="fancy-button" id="feeling">I'm Feeling Boogley</button>
                </div>

                <!-- Settings panel - shown when user clicks the settings button -->
                <div id="settings-panel" class="settings-panel" aria-hidden="true" hidden>
                    <h2>Settings</h2>
                    <div class="setting-row">
                        <label for="open-mode">When searching:</label>
                        <select id="open-mode">
                            <option value="same">Open in same tab</option>
                            <option value="new">Open in new tab</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label for="enable-history">Search history:</label>
                        <select id="enable-history">
                            <option value="on">Enabled</option>
                            <option value="off">Disabled</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <button id="clear-history" class="fancy-button" title="Clear search history">Clear History</button>
                        <button id="settings-close" class="fancy-button">Back to Search</button>
                    </div>
                </div>

                <div id="results" class="results"></div>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 RedstoneCoreDev | Boogle. Just for fun!</p>
            <p>Even if the name sounds similar to Google it is not intendet to imitate Google.<br>More in the README.md in the <a href="https://github.com/RedstoneCoreDev/RedstoneCoreDev.github.io">Github Repository</a></p>
        </footer>
    </div>
    <script src="boogle.js"></script>
</body>
</html>
