<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boogle Search - search fancy</title>
    <link rel="icon" type="image/png" href="boogle.png">
    <link rel="stylesheet" href="boogle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Boogle Search</h1>
        </header>
        <main>
            <div class="search-container">
                <div class="search-top">
                    <select id="engine-select" title="Choose search engine">
                        <option value="ddg">DuckDuckGo</option>
                        <option value="google">Google</option>
                    </select>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Search Boogle..." autocomplete="off">
                        <button id="search-button">Search</button>
                    </div>
                </div>
                <div class="buttons">
                    <button class="fancy-button" id="feeling">I'm Feeling Boogley</button>
                </div>

                <div id="results" class="results"></div>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 RedstoneCoreDev | Boogle. Just for fun!</p>
            <p>Even if the name sounds similar to Google it is not intendet to imitate Google.<br>More in the README.md in the <a href="https://github.com/RedstoneCoreDev/RedstoneCoreDev.github.io">Github Repository</a></p>
        </footer>
    </div>
    <script src="boogle.js"></script>
</body>
</html>
