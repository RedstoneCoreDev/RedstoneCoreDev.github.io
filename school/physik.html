<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');
:root{--nav-w:234px;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;--a-arbeit:#3b82f6;--a-energie:#10b981;--a-leistung:#f59e0b;--a-wirkungsgrad:#ef4444;--a-drehbewegung:#a855f7;--a-einheiten:#06b6d4;--a-variablen:#f97316;--a-lernkarten:#ec4899;--a-rechner:#84cc16;--a-animationen:#14b8a6;--tr:0.22s cubic-bezier(.4,0,.2,1)}

html[data-theme="light"]{--bg:#f0f2f6;--surf:#ffffff;--surf2:#e8ebf0;--brd:#d8dce6;--brd2:#b8bece;--txt:#111318;--txt2:#4a505f;--muted:#8890a0;--inp:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;display:flex;transition:background var(--tr),color var(--tr)}
nav{position:fixed;top:0;left:0;width:var(--nav-w);height:100vh;background:var(--surf);border-right:1px solid var(--brd);display:flex;flex-direction:column;z-index:200;overflow:hidden;transition:width var(--tr),background var(--tr),border-color var(--tr),transform var(--tr)}
nav.collapsed{width:0;border-right-color:transparent}
.nav-inner{width:var(--nav-w);flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:18px 0 0}
.nav-logo{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;padding:0 16px 14px;border-bottom:1px solid var(--brd);margin-bottom:8px;white-space:nowrap}
.nav-logo strong{display:block;font-family:var(--sans);font-size:15px;font-weight:800;color:var(--txt);letter-spacing:-.02em;margin-top:3px}
.nav-links{flex:1;display:flex;flex-direction:column;gap:1px;padding:0 0 6px}
a.nl{display:flex;align-items:center;gap:9px;padding:8px 16px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:600;border-left:2px solid transparent;transition:all .13s;white-space:nowrap}
a.nl:hover{color:var(--txt);background:rgba(128,128,128,.07)}
a.nl.active{color:var(--txt);border-left-color:var(--c);background:rgba(128,128,128,.05)}
a.nl .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--c,var(--muted))}
.nav-sep{height:1px;background:var(--brd);margin:6px 0}
.nav-settings{border-top:1px solid var(--brd);padding:10px 16px 14px;display:flex;flex-direction:column;gap:9px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.slabel{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ptoggle{display:flex;background:var(--surf2);border-radius:99px;padding:2px;gap:2px}
.ptoggle button{background:none;border:none;border-radius:99px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted);padding:3px 8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.ptoggle button.active{background:var(--surf);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.25)}
#cbtn{position:fixed;top:14px;left:calc(var(--nav-w) + 8px);z-index:300;background:var(--surf);border:1px solid var(--brd);border-radius:7px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:left var(--tr),background var(--tr),border-color var(--tr);color:var(--muted)}
#cbtn:hover{color:var(--txt);border-color:var(--brd2)}
body.nc #cbtn{left:8px}
#cbtn svg{transition:transform var(--tr)}
body.nc #cbtn svg{transform:scaleX(-1)}
main{margin-left:var(--nav-w);flex:1;padding:48px 40px 80px;max-width:calc(100% - var(--nav-w));transition:margin-left var(--tr),max-width var(--tr);min-width:0}
body.nc main{margin-left:0;max-width:100%}
.eyebrow{font-size:11px;font-family:var(--mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.pg-title{font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:32px}
.search-wrap{margin-bottom:28px}
.sinput{width:100%;max-width:460px;background:var(--inp);border:1px solid var(--brd2);border-radius:8px;padding:9px 14px;font-family:var(--mono);font-size:13px;color:var(--txt);outline:none;transition:border-color .2s,background var(--tr)}
.sinput::placeholder{color:var(--muted)}
.sinput:focus{border-color:#3b82f6}
.section{margin-bottom:56px;scroll-margin-top:24px}
.shdr{display:flex;align-items:center;gap:9px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--brd)}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stitle{font-size:19px;font-weight:800;letter-spacing:-.02em}
.scnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--brd2);padding:2px 8px;border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:17px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s,background var(--tr)}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent)}
.card:hover{border-color:var(--brd2);transform:translateY(-1px)}
[data-section="arbeit"]{--accent:var(--a-arbeit)}[data-section="energie"]{--accent:var(--a-energie)}[data-section="leistung"]{--accent:var(--a-leistung)}[data-section="wirkungsgrad"]{--accent:var(--a-wirkungsgrad)}[data-section="drehbewegung"]{--accent:var(--a-drehbewegung)}[data-section="einheiten"]{--accent:var(--a-einheiten)}[data-section="variablen"]{--accent:var(--a-variablen)}[data-section="lernkarten"]{--accent:var(--a-lernkarten)}[data-section="rechner"]{--accent:var(--a-rechner)}[data-section="animationen"]{--accent:var(--a-animationen)}
.cname{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;font-family:var(--mono)}
.fmain{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--txt);margin-bottom:6px}
.funits{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:11px;padding:4px 8px;background:var(--surf2);border-radius:5px;border:1px solid var(--brd);transition:background var(--tr)}
.cdesc{font-size:13px;line-height:1.6;color:var(--txt2);margin-bottom:8px}
.cwhen{font-size:11px;color:var(--muted);background:var(--surf2);border-radius:5px;padding:5px 9px;border-left:2px solid var(--accent);transition:background var(--tr)}
.cwhen::before{content:'→ ';font-family:var(--mono);color:var(--accent)}
.legend{margin-top:11px;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--brd);padding-top:9px;display:grid;grid-template-columns:auto 1fr;gap:2px 9px}
.lsym{color:var(--txt);font-weight:700}
.flashcard{cursor:pointer}
.fc-wrap{position:relative;width:100%;min-height:180px;perspective:800px}
.fc-inner{width:100%;min-height:180px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);position:relative}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{backface-visibility:hidden;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;border-radius:8px}
.fc-back{transform:rotateY(180deg);background:var(--surf2)}
.calc-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.calc-input{background:var(--inp);border:1px solid var(--brd2);border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:14px;color:var(--txt);outline:none;width:100%;transition:border-color .2s}
.calc-input:focus{border-color:#3b82f6}
.calc-arrow{font-family:var(--mono);font-size:18px;color:var(--muted);text-align:center}
.calc-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.anim-card{background:var(--surf);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.anim-canvas{width:100%;height:180px;display:block;background:var(--surf2)}
.anim-vars{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--brd);min-height:50px;align-items:center}
.var-chip{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--brd2);color:var(--txt2);transition:all .4s;opacity:0;transform:translateY(4px)}
.var-chip.vis{opacity:1;transform:none}
.var-chip.hi{color:var(--accent,var(--a-animationen));border-color:var(--accent,var(--a-animationen))}
.anim-formula{padding:8px 16px;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--txt);min-height:38px;transition:opacity .4s;opacity:0}
.anim-formula.vis{opacity:1}
.anim-desc{padding:8px 16px 12px;font-size:12.5px;color:var(--txt2);line-height:1.5;min-height:40px}
.anim-ctrl{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--brd)}
.abtn{background:var(--surf2);border:1px solid var(--brd2);border-radius:7px;padding:6px 13px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--txt);cursor:pointer;transition:all .15s}
.abtn:hover{border-color:var(--a-animationen);color:var(--a-animationen)}
.abtn.pri{background:var(--a-animationen);color:#fff;border-color:var(--a-animationen)}
.abtn.pri:hover{opacity:.85}
.astep{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
.hidden{display:none!important}
@media(max-width:680px){nav{transform:translateX(-100%);width:var(--nav-w)!important;box-shadow:4px 0 24px rgba(0,0,0,.3)}nav.mob-open{transform:translateX(0)}#cbtn{left:8px!important}main{margin-left:0!important;max-width:100%!important;padding:48px 16px 60px}.cards{grid-template-columns:1fr}.calc-grid{grid-template-columns:1fr;gap:6px}.calc-arrow{display:none}}

function sysLang(){return(navigator.language||'en').toLowerCase().startsWith('de')?'de':'en'}
function sysTh(){return window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'}
function L(o){if(!o)return'';return typeof o==='string'?o:(o[lang]||o.en||o.de||'')}
function T(k,...a){const t=TR[lang]||TR.en;const v=t[k];return typeof v==='function'?v(...a):(v||k)}

function loadP(){
  const s=JSON.parse(localStorage.getItem('nw3')||'{}');
  curTP=s.tp||'system';curLP=s.lp||'system';
  lang=curLP==='system'?sysLang():curLP;
  document.documentElement.dataset.theme=curTP==='system'?sysTh():curTP;
}
function saveP(){localStorage.setItem('nw3',JSON.stringify({tp:curTP,lp:curLP}))}

function fcHTML(f,sec){
  const leg=f.l?`<div class="legend">${f.l.map(l=>`<span class="lsym">${l.s}</span><span>${l[lang]||l.en}</span>`).join('')}</div>`:'';
  const u=f.u?`<div class="funits">${f.u}</div>`:'';
  const w=f.w?`<div class="cwhen">${L(f.w)}</div>`:'';
  return`<div class="card" data-section="${sec}"><div class="cname">${L(f.n)}</div><div class="fmain">${f.f}</div>${u}<div class="cdesc">${L(f.d)}</div>${w}${leg}</div>`;
}

window.cu=function(i,d){
  const c=CONV[i],a=document.getElementById(`ca-${i}`),b=document.getElementById(`cb-${i}`);

  else{const v=parseFloat(b.value);if(!isNaN(v))a.value=+c.inv(v).toPrecision(6);}
};

function isDk(){return document.documentElement.dataset.theme==='dark'}
function tc(d,l){return isDk()?d:l}

function drawStep(id){
  const anim=ANIMS.find(a=>a.id===id);if(!anim)return;
  const st=animSt[id]||(animSt[id]={i:0,timer:null});
  const step=anim.steps[st.i];
  const cv=document.getElementById(`cv-${id}`);if(!cv)return;
  cv.width=cv.offsetWidth||700;
  const ctx=cv.getContext('2d');
  // draw
  if(id==='hubarbeit')drawCrane(ctx,cv.width,cv.height,step.lift||0);
  else if(id==='kinetisch')drawTrain(ctx,cv.width,cv.height,step.spd||0);
  else if(id==='wirkungsgrad')drawEng(ctx,cv.width,cv.height,step.fill||0);
  // vars
  const vc=document.getElementById(`av-${id}`);
  if(vc)vc.innerHTML=step.vars.map((v,i)=>`<span class="var-chip vis${i===step.vars.length-1?' hi':''}">${v}</span>`).join('');
  // formula
  const fc=document.getElementById(`af-${id}`);
  if(fc){fc.textContent=step.f||'';fc.classList.toggle('vis',!!step.f);}
  // desc
  const dc=document.getElementById(`ad-${id}`);
  if(dc)dc.textContent=L(step.d);
  // step
  const sc=document.getElementById(`astep-${id}`);
  if(sc)sc.textContent=T('step',st.i+1)+` / ${anim.steps.length}`;
}

function drawCrane(ctx,W,H,lift){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=tc('#181a22','#eef0f4');ctx.fillRect(0,0,W,H);
  ctx.fillStyle=tc('#2a2d3a','#d0d4de');ctx.fillRect(0,H-26,W,26);
  const tx=W*.62,th=H*.8;
  ctx.strokeStyle=tc('#3a3f50','#9098a8');ctx.lineWidth=5;
  ctx.strokeRect(tx,H-26-th,18,th);
  ctx.beginPath();ctx.moveTo(tx+9,H-26-th);ctx.lineTo(W*.22,H-26-th);ctx.stroke();
  const cy=H-26-38-lift*(H*.54);
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W*.22,H-26-th);ctx.lineTo(W*.22,cy);ctx.stroke();
  ctx.fillStyle='#3b82f6';ctx.globalAlpha=.85;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W*.22-20,cy,40,38,4);else ctx.rect(W*.22-20,cy,40,38);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=tc('#fff','#111');ctx.font='bold 10px monospace';ctx.textAlign='center';
  ctx.fillText('500 kg',W*.22,cy+23);
  if(lift>.05){
    ctx.strokeStyle='#10b981';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(W*.22-32,H-26-38);ctx.lineTo(W*.22-32,cy);ctx.stroke();
    ctx.fillStyle='#10b981';ctx.font='bold 10px monospace';ctx.textAlign='right';
    ctx.fillText(`h=${(lift*12).toFixed(0)}m`,W*.22-34,(H-26-38+cy)/2+4);
  }
}

function drawTrain(ctx,W,H,spd){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=tc('#181a22','#eef0f4');ctx.fillRect(0,0,W,H);
  ctx.fillStyle=tc('#2a2d3a','#d0d4de');ctx.fillRect(0,H-26,W,26);
  ctx.strokeStyle=tc('#3a3f50','#8890a0');ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,H-28);ctx.lineTo(W,H-28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H-17);ctx.lineTo(W,H-17);ctx.stroke();
  const tx=W*.1,ty=H-28-56,tw=W*.5;
  ctx.fillStyle='#3b82f6';ctx.globalAlpha=.9;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(tx,ty,tw,56,8);else ctx.rect(tx,ty,tw,56);ctx.fill();ctx.globalAlpha=1;
  for(let i=0;i<3;i++){ctx.fillStyle=tc('rgba(255,255,255,.25)','rgba(255,255,255,.6)');ctx.fillRect(tx+18+i*56,ty+10,36,26);}
  [tx+28,tx+tw-28].forEach(wx=>{
    ctx.beginPath();ctx.arc(wx,H-28,12,0,Math.PI*2);ctx.fillStyle=tc('#2d3040','#8890a0');ctx.fill();
    ctx.beginPath();ctx.arc(wx,H-28,5,0,Math.PI*2);ctx.fillStyle=tc('#555','#b0b8c8');ctx.fill();
  });
  if(spd>.3){
    ctx.strokeStyle='#f59e0b';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(tx+tw+6,ty+28);ctx.lineTo(tx+tw+6+spd*45,ty+28);ctx.stroke();
    ctx.fillStyle='#f59e0b';ctx.font='bold 11px monospace';ctx.textAlign='left';
    ctx.fillText('v = 30 m/s',tx+tw+10,ty+24);
  }
}

function drawEng(ctx,W,H,fill){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=tc('#181a22','#eef0f4');ctx.fillRect(0,0,W,H);
  const bx=W*.06,by=H*.32,bw=W*.88,bh=28;
  ctx.fillStyle=tc('#2a2d3a','#d0d4de');
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,bw,bh,5);else ctx.rect(bx,by,bw,bh);ctx.fill();
  if(fill>0){
    ctx.fillStyle='#10b981';ctx.globalAlpha=.85;
    const uw=bw*Math.min(fill*.75,.75);
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,uw,bh,5);else ctx.rect(bx,by,uw,bh);ctx.fill();ctx.globalAlpha=1;
  }
  if(fill>.6){
    ctx.fillStyle='#ef4444';ctx.globalAlpha=.75;
    const sx=bx+bw*.75;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(sx,by,bw*.25,bh,5);else ctx.rect(sx,by,bw*.25,bh);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#ef4444';ctx.font='bold 10px monospace';ctx.textAlign='center';
    ctx.fillText('Verlust 250 J',bx+bw*.875,by+bh+16);
  }
  ctx.fillStyle=tc('#e8eaf0','#111318');ctx.font='bold 11px monospace';ctx.textAlign='center';
  ctx.fillText(fill<.35?'W_zu = 1000 J':'W_nutz = 750 J',W/2,by-10);
  ctx.fillStyle='#f59e0b';ctx.globalAlpha=.9;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W*.38,H*.52,W*.24,H*.32,8);else ctx.rect(W*.38,H*.52,W*.24,H*.32);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=tc('#0a0b0f','#fff');ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText('Motor',W/2,H*.7);
  if(fill>=1){ctx.fillStyle='#10b981';ctx.font='bold 14px monospace';ctx.fillText('\u03b7 = 75%',W/2,H*.9);}
}

window.aNext=function(id){const a=ANIMS.find(x=>x.id===id);if(!a)return;const s=animSt[id]||(animSt[id]={i:0});s.i=Math.min(s.i+1,a.steps.length-1);drawStep(id);};
window.aPrev=function(id){const a=ANIMS.find(x=>x.id===id);if(!a)return;const s=animSt[id]||(animSt[id]={i:0});s.i=Math.max(s.i-1,0);drawStep(id);};
window.aReset=function(id){const s=animSt[id];if(s&&s.timer){clearInterval(s.timer);s.timer=null;const b=document.getElementById(`aauto-${id}`);if(b)b.textContent=T('auto');}animSt[id]={i:0,timer:null};drawStep(id);};
window.aAuto=function(id){
  const a=ANIMS.find(x=>x.id===id);if(!a)return;
  const s=animSt[id]||(animSt[id]={i:0,timer:null});
  const btn=document.getElementById(`aauto-${id}`);
  if(s.timer){clearInterval(s.timer);s.timer=null;if(btn)btn.textContent=T('auto');return;}
  if(btn)btn.textContent=T('stop');
  s.timer=setInterval(()=>{s.i++;if(s.i>=a.steps.length){clearInterval(s.timer);s.timer=null;s.i=a.steps.length-1;if(btn)btn.textContent=T('auto');}drawStep(id);},1900);
};

function renderAll(){
  document.getElementById('nl-ey').textContent=T('ey');
  document.getElementById('nl-ti').textContent=T('ti');
  document.getElementById('m-ey').textContent=T('ey');
  document.getElementById('m-ti').innerHTML=T('mti');
  document.getElementById('search').placeholder=T('search');
  document.getElementById('sl-th').textContent=T('theme');
  document.getElementById('sl-la').textContent=T('lang');
  document.title=`${T('ey')} \u00b7 ${T('ti')}`;
  document.documentElement.lang=lang;
  document.getElementById('nav-links').innerHTML=CATS.map(id=>`<a class="nl" href="#${id}" data-cat="${id}" style="--c:var(--a-${id})"><span class="dot"></span>${T('cats')[id]||id}</a>`).join('')+'<div class="nav-sep"></div>';
  let html='';
  Object.entries(FD).forEach(([id,fms])=>{html+=secHTML(id,T('fml',fms.length),fms.map(f=>fcHTML(f,id)).join(''));});
  html+=secHTML('einheiten',T('ref'),EINH.map(f=>fcHTML(f,'einheiten')).join(''));
  html+=secHTML('variablen',T('ref'),renderVars());
  html+=secHTML('lernkarten',T('fml',12),renderFlash());
  html+=secHTML('rechner',`${CONV.length}`,renderRechner());
  html+=secHTML('animationen',`${ANIMS.length}`,renderAnims());
  document.getElementById('root').innerHTML=html;
  requestAnimationFrame(()=>{ANIMS.forEach(a=>{const cv=document.getElementById(`cv-${a.id}`);if(cv){cv.width=cv.offsetWidth||700;animSt[a.id]={i:0,timer:null};drawStep(a.id);}});rebindObs();});
}

let obs;
function rebindObs(){
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.nl').forEach(l=>l.classList.remove('active'));const l=document.querySelector(`.nl[href="#${e.target.id}"]`);if(l)l.classList.add('active');}});},{threshold:.15});
  document.querySelectorAll('.section').forEach(s=>obs.observe(s));
}

document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q)));
  document.querySelectorAll('.section').forEach(s=>{const vis=[...s.querySelectorAll('.card')].some(c=>!c.classList.contains('hidden'));s.classList.toggle('hidden',q&&!vis);});
});

  if(isMob){sidebar.classList.toggle('mob-open');overlay.style.display=sidebar.classList.contains('mob-open')?'block':'none';}
  else{document.body.classList.toggle('nc');sidebar.classList.toggle('collapsed');}
